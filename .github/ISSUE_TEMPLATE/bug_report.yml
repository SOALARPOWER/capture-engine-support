name: バグ報告
description: DMM/FANZA GAMES Capture Engine の不具合を報告します
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        DMM/FANZA GAMES Capture Engine の不具合報告ありがとうございます。

        可能な範囲で以下の項目を入力してください。
        ゲーム固有の不具合の場合は、ゲームタイトルとURLも記載してください。

        ※ Cookie、token、認証情報、POST内容などの機密情報は投稿しないでください。

  - type: input
    id: game_title
    attributes:
      label: ゲームタイトル
      description: 不具合が発生したゲームのタイトルを入力してください。
      placeholder: 例）推し神カオティック〜ハチャメチャ大乱闘〜
    validations:
      required: false

  - type: input
    id: game_url
    attributes:
      label: ゲームURL
      description: DMM/FANZA GAMES のゲームページURLを入力してください。
      placeholder: https://play.games.dmm.co.jp/game/...
    validations:
      required: false

  - type: input
    id: extension_version
    attributes:
      label: Capture Engine バージョン
      description: 使用しているアドオンのバージョンを入力してください。
      placeholder: 例）0.9.0-beta
    validations:
      required: true

  - type: dropdown
    id: problem_type
    attributes:
      label: 問題の種類
      options:
        - ゲームを起動できない
        - ゲーム本体を解析できない
        - 表示領域・拡大縮小がおかしい
        - Captureウィンドウがおかしい
        - スクリーンショット / Burst PNG
        - Clean Mode / 録画関連
        - ゲーム一覧 / サムネイル
        - 権限要求・optional permission
        - UI / レイアウト
        - その他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 発生した問題
      description: 何が起きたかをできるだけ具体的に記載してください。
      placeholder: |
        例：
        ゲームスタート後に再解析を押しましたが、
        「ゲーム本体を解析できませんでした」と表示されました。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: 問題を再現できる手順があれば記載してください。
      placeholder: |
        1. ゲームを登録
        2. ゲームページを開く
        3. 「ゲームスタート」を押す
        4. Capture Engineへ戻り「再解析」を押す
        5. エラーが表示される
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: 期待していた動作
      placeholder: 例）ゲーム本体が解析され、Captureウィンドウが起動する
    validations:
      required: false

  - type: textarea
    id: capture_engine_info
    attributes:
      label: Capture Engine 診断情報
      description: |
        アドオンの「バグを報告」から開いた場合、
        ここに診断情報が自動入力される予定です。
      placeholder: |
        State:
        Adapter:
        Last status:
        Display viewport:
        Render resolution:
      render: text
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: その他
      description: スクリーンショットや補足情報があれば記載してください。
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認事項
      options:
        - label: Cookie、token、認証情報などの機密情報を含めていないことを確認しました。
          required: true
        - label: DMM/FANZA GAMES Capture Engine が非公式ツールであることを理解しています。
          required: true
